name: Georgia Tender Bot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            seen_tenders.json
            tracked_tenders.json
          key: tender-data-${{ runner.os }}
          restore-keys: tender-data-

      - name: Reset seen
        run: rm -f seen_tenders.json tracked_tenders.json

      - name: Run bot
        run: python georgia_tender_bot_READY.py

      - name: Save cache
        uses: actions/cache@v3
        with:
          path: |
            seen_tenders.json
            tracked_tenders.json
          key: tender-data-${{ runner.os }}
